<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The preconnect to the API origin is injected here at build time by the
         `apiPreconnect` plugin in vite.config.ts, which reads VITE_API_BASE_URL
         so no host is hardcoded. It is NOT written literally in this file: a
         `%VITE_API_BASE_URL%` in a <link href> makes `vite build` run decodeURI
         over `%VI`, which is not a valid escape, and the build dies with
         `[vite:build-html] URI malformed` — naming this file and never the
         variable. The plugin emits nothing when the variable is unset, so a
         local build without it still works. -->
    <!-- interactive-widget=resizes-content: when the on-screen keyboard opens,
         shrink the LAYOUT viewport (not just the visual one). This makes 100dvh /
         100% / innerHeight reflect the space above the keyboard on every device —
         including tablets & split/floating keyboards where the native window does
         NOT resize (the default `resizes-visual` leaves the layout full-height, so
         a bottom-pinned composer ends up hidden behind the keyboard). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dealer Kavach</title>
    <style>
      .boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
      .boot-spin{width:24px;height:24px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;opacity:.35;animation:boot-spin .8s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body class="bg-bg text-text antialiased">
    <!-- Drawn by the HTML itself, before any script has arrived, so the app is
         never an empty white page while its code downloads on a slow link.
         React replaces it the moment it draws its first screen. -->
    <div id="root"><div class="boot" aria-hidden="true"><div class="boot-spin"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
